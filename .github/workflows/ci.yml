name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: Test123@
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, xml, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create tests/.env
        run: |
          cat > tests/.env <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=test_db_to_php
          DB_USERNAME=root
          DB_PASSWORD=Test123@
          EOF

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -p'Test123@' --silent; then
              echo "MariaDB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready in time" >&2
          exit 1

      - name: Run test suite
        run: vendor/bin/phpunit

  tests-complete:
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test matrix jobs passed
        run: |
          echo "tests result: ${{ needs.tests.result }}"
          if [ "${{ needs.tests.result }}" != "success" ]; then
            exit 1
          fi
